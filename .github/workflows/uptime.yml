# Outside check of wikitours.ma every hour (Vercel's platform used to cover availability).
# A failing run makes GitHub e-mail the repo owner (the author of this schedule). No secrets, no
# build: it only reads public URLs and the certificate. Private-repo cost: about 1 Actions minute
# per run, ~720 of the 2,000 free minutes a month (seo-audit.yml uses the rest on pushes).
name: uptime
on:
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:
permissions: {}
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Pages, redirects, admin and certificate
        run: |
          set -u
          fail=0
          check() {
            code=$(curl -s -o /dev/null -m 25 -A 'wikitours-uptime' -w '%{http_code}' "$1" || echo 000)
            echo "$1 -> HTTP $code (want $2)"
            [ "$code" = "$2" ] || fail=1
          }
          check https://wikitours.ma/fr 200
          check https://wikitours.ma/ar 200
          check https://wikitours.ma/fr/avis 200
          check https://www.wikitours.ma/fr 301
          check https://admin.wikitours.ma/login 200
          end=$(echo | openssl s_client -connect wikitours.ma:443 -servername wikitours.ma 2>/dev/null | openssl x509 -noout -enddate | cut -d= -f2)
          days=$(( ( $(date -d "$end" +%s) - $(date +%s) ) / 86400 ))
          echo "certificate expires $end ($days days)"
          [ "$days" -ge 14 ] || fail=1
          exit $fail
