name: SEO gates (blocking)

# Two layers, both blocking:
#  1. `npm run build` — its postbuild runs scripts/seo-suite.mjs (titles, meta,
#     canonical, hreflang, sitemap, links, language, rendering + the schema
#     gate) and `npm test` against the build output. A regression fails the
#     build here exactly as it does on Vercel.
#  2. scripts/seo-audit.js — the live crawl of the sitemap against a started
#     server (or a staging URL via workflow_dispatch).
# Make this job a REQUIRED status check on the deploy branch so a red gate
# blocks the merge/deploy. The build needs the Supabase secrets below
# (generateStaticParams reads published rows).

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      base_url:
        description: 'Audit an already-deployed staging URL instead of building here'
        required: false
        default: ''

jobs:
  seo-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # 22, not 20: @supabase/supabase-js needs a native WebSocket (Node 22+).
          # On 20 every database read in the build threw « native WebSocket not
          # found », so this job had failed on every push since it was added.
          node-version: 22
          cache: npm

      # --- Mode A: audit an existing staging deployment ---------------------
      - name: Audit staging URL
        if: ${{ inputs.base_url != '' }}
        run: BASE_URL='${{ inputs.base_url }}' node scripts/seo-audit.js

      # --- Mode B (default): build (postbuild = the gates), serve, live audit --
      - name: Install
        if: ${{ inputs.base_url == '' }}
        run: npm ci

      # Every run of this job has failed ~10 s into the Build step, before Next
      # prints a single page — the signature of the Supabase client refusing to
      # start with an empty URL. The build reads published rows at
      # generateStaticParams, so the three secrets are not optional. This step
      # turns a silent exit 1 into a message that names what is missing.
      - name: Check the Supabase secrets exist
        if: ${{ inputs.base_url == '' }}
        env:
          SB_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SB_ANON: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SB_SERVICE: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          missing=""
          [ -z "$SB_URL" ] && missing="$missing NEXT_PUBLIC_SUPABASE_URL"
          [ -z "$SB_ANON" ] && missing="$missing NEXT_PUBLIC_SUPABASE_ANON_KEY"
          [ -z "$SB_SERVICE" ] && missing="$missing SUPABASE_SERVICE_ROLE_KEY"
          if [ -n "$missing" ]; then
            echo "::error::Repository secrets missing:$missing — add them in GitHub → Settings → Secrets and variables → Actions (the values are the ones in .env.local)."
            exit 1
          fi
          echo "Supabase secrets present"

      - name: Build (postbuild runs scripts/seo-suite.mjs + scripts/schema-audit.mjs + npm test)
        if: ${{ inputs.base_url == '' }}
        run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: http://localhost:3000
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: Self-test the gates (every known defect must still be caught)
        if: ${{ inputs.base_url == '' }}
        run: npm run seo:suite -- --self-test

      - name: Start server, wait, live audit (fails on any audit failure)
        if: ${{ inputs.base_url == '' }}
        env:
          NEXT_PUBLIC_SITE_URL: http://localhost:3000
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          npm start -- -p 3000 &
          SERVER_PID=$!
          # Poll until the sitemap answers (no extra deps).
          for i in $(seq 1 60); do
            curl -sf http://localhost:3000/sitemap.xml >/dev/null && break
            sleep 2
          done
          set +e
          BASE_URL=http://localhost:3000 node scripts/seo-audit.js
          CODE=$?
          kill $SERVER_PID 2>/dev/null
          exit $CODE
